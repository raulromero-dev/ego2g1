<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my walk of life — the film</title>
<meta name="description" content="The whole thing as a two-minute film: every section, one scene each.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Architects+Daughter&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --ink:#000000; --ink-2:#666666; --ink-3:#8F8F8F;
  --line:#EAEAEA; --sunken:#FAFAFA;
  --sans:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  --marker:'Architects Daughter',cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#000000; --ink:#EDEDED; --ink-2:#A1A1A1; --ink-3:#7D7D7D;
    --line:#1F1F1F; --sunken:#0A0A0A;
  }
}
:root[data-theme="dark"]{
  --paper:#000000; --ink:#EDEDED; --ink-2:#A1A1A1; --ink-3:#7D7D7D;
  --line:#1F1F1F; --sunken:#0A0A0A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── the stage ────────────────────────────────────────────────── */
#stage{position:fixed; inset:0; display:grid; place-items:center;}
.scene{
  position:absolute; inset:0; display:grid; place-items:center;
  padding:clamp(24px,5vw,90px);
  opacity:0; pointer-events:none; transition:opacity .55s ease;
}
.scene.on{opacity:1;}
.inner{width:min(1180px,100%); }

h1{
  font-size:clamp(44px,9vw,132px); line-height:.9; font-weight:600;
  letter-spacing:-.04em; margin:0; text-wrap:balance;
}
h1 em{font-style:italic}
h2{
  font-size:clamp(30px,5.6vw,74px); line-height:1.0; font-weight:600;
  letter-spacing:-.035em; margin:0 0 .38em; max-width:17ch; text-wrap:balance;
}
h2.wide{max-width:none}
p.lede{
  font-size:clamp(17px,1.9vw,25px); line-height:1.5; color:var(--ink-2);
  max-width:52ch; margin:0;
}
p.lede b{color:var(--ink); font-weight:600}
.kicker{
  font-family:var(--mono); font-size:12px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 1.6rem;
}
.marker{font-family:var(--marker); font-size:clamp(20px,2.2vw,30px); color:var(--ink)}

/* words that arrive one at a time */
.w{display:inline-block; opacity:0; transform:translateY(.34em);
   transition:opacity .5s ease, transform .5s cubic-bezier(.2,.7,.3,1)}
.w.in{opacity:1; transform:none}

figure{margin:0}
.plate img, .plate video{
  display:block; width:100%; height:auto; max-height:66vh; object-fit:contain;
  border-radius:3px;
}
.two-up{display:grid; grid-template-columns:1fr 1fr; gap:clamp(20px,4vw,64px); align-items:center}
.stat-row{display:flex; gap:clamp(28px,6vw,96px); flex-wrap:wrap; margin-top:2.2rem}
.stat .n{font-family:var(--mono); font-size:clamp(34px,5vw,62px); font-weight:500; line-height:1}
.stat .n small{font-size:.42em; color:var(--ink-3); margin-left:.15em}
.stat .k{font-size:.82rem; color:var(--ink-3); margin-top:.5rem}
.stat .v{font-size:.74rem; color:var(--ink-3); margin-top:.2rem}
canvas{display:block; width:100%}
figcaption{font-size:.78rem; color:var(--ink-3); margin-top:1rem; line-height:1.5}

/* ── transport ────────────────────────────────────────────────── */
#bar{
  position:fixed; left:0; right:0; bottom:0; height:3px;
  background:var(--line); z-index:20;
}
#fill{height:100%; width:0; background:var(--ink); transition:width .1s linear}
#chapters{position:fixed; left:0; right:0; bottom:0; height:3px; display:flex; gap:2px; z-index:21}
#chapters i{flex:1; background:transparent; cursor:pointer}
#hud{
  position:fixed; left:0; right:0; bottom:16px; z-index:22;
  display:flex; align-items:center; justify-content:center; gap:16px;
  opacity:0; transition:opacity .3s ease; pointer-events:none;
}
#hud.show{opacity:1; pointer-events:auto}
#hud button{
  font:500 12px var(--sans); letter-spacing:.04em;
  background:var(--paper); color:var(--ink); border:1px solid var(--line);
  border-radius:999px; padding:7px 15px; cursor:pointer;
}
#hud button:hover{border-color:var(--ink-3)}
#hud .t{font-family:var(--mono); font-size:11.5px; color:var(--ink-3)}
#tag{
  position:fixed; top:18px; left:20px; z-index:22;
  font-family:var(--mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3);
  text-decoration:none;
}
#tag:hover{color:var(--ink)}
@media (max-width:760px){ .two-up{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ .w{transition:none} .scene{transition:none} }
</style>
</head>
<body>

<a id="tag" href="/">← my walk of life</a>
<div id="stage"></div>

<div id="bar"><div id="fill"></div></div>
<div id="chapters"></div>
<div id="hud">
  <button id="back">←</button>
  <button id="play">pause</button>
  <button id="fwd">→</button>
  <span class="t" id="clock">0:00</span>
</div>

<script src="/film.js?v=1786713562"></script>
</body>
</html>
